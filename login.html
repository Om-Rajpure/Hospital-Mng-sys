<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Login - City Hospital</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
    <div class="logo">
        <img src="logo.png" alt="Hospital Logo" onerror="this.style.display='none'">
        <h2>🏥 City Hospital</h2>
    </div>
    <ul id="navMenu">
        <li><a href="index.html">Home</a></li>
        <li><a href="doctors.html">Doctors</a></li>
        <li id="navRegister"><a href="register.html">Register</a></li>
        <li id="navLogin"><a href="login.html" class="active">Login</a></li>
        <li><a href="appointment.html">Appointment</a></li>
        <li id="navUser" style="display:none;"><span id="userNameBadge" style="color: #ffeb3b; font-weight: bold; margin-right: 10px;"></span><a href="#" id="logoutBtn" style="color:#ffc107;">Logout</a></li>
    </ul>
</nav>

<div class="register-box">
    <h1>Patient Login</h1>

    <form id="loginForm">

        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" placeholder="Enter Email" required>

        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" placeholder="Enter Password" required>

        <button type="submit" id="loginSubmitBtn">Login</button>

    </form>

    <div id="loginResult" role="status" aria-live="polite" style="margin-top: 15px; font-weight: bold; text-align: center;"></div>

    <p style="text-align: center; margin-top: 15px; font-size: 14px; color: #555;">
        Don't have an account? <a href="register.html" style="color: #0d6efd; font-weight: bold;">Register here</a>
    </p>
</div>

<!-- Footer -->
<footer>
    <h3>🏥 City Hospital</h3>
    <p>📍 Navi Mumbai, Maharashtra</p>
    <p>📞 +91 9876543210</p>
    <p>✉ cityhospital@gmail.com</p>
    <p>© 2026 City Hospital. All Rights Reserved.</p>
</footer>

<script src="script.js"></script>

</body>
</html>
